spring.application.name=producto-service
server.port = 8082

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_producto?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs

logging.level.cl.volvo=DEBUG
logging.pattern.console=%d{HH:mm:ss} [%level] %logger{20}: %msg%n
logging.file.name=logs/producto.log