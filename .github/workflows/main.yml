name: producto-service
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar y obtener codigo
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Correr pruebas unitarias
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: Crear carpeta en AWS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.IP_SERVER}}
          username: ${{secrets.USERNAME}}
          key: ${{secrets.KEY}}
          port: ${{secrets.PORT}}
          script: |
            mkdir -p /home/ubuntu/volvo/producto-service

      - name: Sincronizar proyecto en el servidor
        uses: burnett01/rsync-deployments@v8
        with:
          switches: "-avz --delete --exclude=.git --exclude=target"
          path: './'
          remote_host: ${{secrets.IP_SERVER}}
          remote_user: ${{secrets.USERNAME}}
          remote_path: "/home/ubuntu/volvo/producto-service"
          remote_key: ${{secrets.KEY}}
          remote_port: ${{secrets.PORT}}

      - name: Levantar docker con docker compose
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.IP_SERVER}}
          username: ${{secrets.USERNAME}}
          key: ${{secrets.KEY}}
          port: ${{secrets.PORT}}
          script: |
            cd /home/ubuntu/volvo
            docker compose up -d --build producto-service